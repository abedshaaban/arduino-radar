<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESP32 Radar - Distance Monitor</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(
          135deg,
          #1e3c72 0%,
          #2a5298 50%,
          #7e22ce 100%
        );
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(
            circle at 20% 50%,
            rgba(120, 119, 198, 0.3),
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(255, 119, 198, 0.3),
            transparent 50%
          );
        pointer-events: none;
        z-index: 0;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 24px;
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4),
          0 0 0 1px rgba(255, 255, 255, 0.1);
        padding: 45px;
        max-width: 600px;
        width: 100%;
        text-align: center;
        position: relative;
        z-index: 1;
        animation: fadeInUp 0.6s ease-out;
        margin: auto;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 8px;
        font-size: 2.5em;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .subtitle {
        color: #64748b;
        margin-bottom: 35px;
        font-size: 0.95em;
        font-weight: 500;
      }

      .distance-display {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        white-space: nowrap;
        overflow-x: auto;
        overflow-y: hidden;
        color: white;
        padding: 35px 40px;
        border-radius: 18px;
        font-size: 3.2em;
        font-weight: 700;
        margin: 30px 0;
        min-height: 130px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        word-break: keep-all;
        position: relative;
        overflow: hidden;
      }

      .distance-display::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        animation: shimmer 3s infinite;
      }

      @keyframes shimmer {
        0% {
          left: -100%;
        }
        100% {
          left: 100%;
        }
      }

      .distance-display:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 20px 50px rgba(102, 126, 234, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }

      .status {
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 0.85em;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
        width: 100%;
        max-width: 280px;
        justify-content: center;
      }

      .status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .status.connected {
        background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
        color: #155724;
        box-shadow: 0 4px 15px rgba(21, 87, 36, 0.2);
      }

      .status.connected::before {
        background: #28a745;
      }

      .status.disconnected {
        background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
        color: #721c24;
        box-shadow: 0 4px 15px rgba(114, 28, 36, 0.2);
      }

      .status.disconnected::before {
        background: #dc3545;
        animation: none;
      }

      .status.connecting {
        background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
        color: #856404;
        box-shadow: 0 4px 15px rgba(133, 100, 4, 0.2);
      }

      .status.connecting::before {
        background: #ffc107;
      }

      .header-controls {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-bottom: 30px;
      }

      .toggle-button {
        padding: 14px 40px;
        font-size: 1.1em;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        position: relative;
        overflow: hidden;
        width: 100%;
        max-width: 280px;
      }

      .toggle-button::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
      }

      .toggle-button:active::before {
        width: 300px;
        height: 300px;
      }

      .toggle-button.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      }

      .toggle-button.inactive {
        background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
        color: #475569;
      }

      .toggle-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      .toggle-button.active:hover {
        box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
      }

      .toggle-button:active {
        transform: translateY(-1px);
      }

      .radar-container {
        margin: 35px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .radar-canvas {
        background: radial-gradient(
          circle,
          #0a0e27 0%,
          #1a1f3a 50%,
          #0f1419 100%
        );
        border-radius: 50%;
        box-shadow: 0 0 40px rgba(0, 255, 0, 0.4),
          inset 0 0 120px rgba(0, 255, 0, 0.15), 0 0 0 4px rgba(0, 255, 0, 0.3);
        border: 3px solid rgba(0, 255, 0, 0.6);
        transition: all 0.3s ease;
        display: block;
        max-width: 100%;
        height: auto;
        width: 100%;
        aspect-ratio: 1;
      }

      .radar-canvas:hover {
        box-shadow: 0 0 50px rgba(0, 255, 0, 0.5),
          inset 0 0 150px rgba(0, 255, 0, 0.2), 0 0 0 4px rgba(0, 255, 0, 0.4);
      }

      .radar-info {
        margin-top: 20px;
        display: flex;
        gap: 25px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .info-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        padding: 15px 20px;
        border-radius: 12px;
        min-width: 100px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
        border: 1px solid rgba(226, 232, 240, 0.8);
      }

      .info-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      }

      .info-label {
        font-size: 0.75em;
        color: #64748b;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }

      .info-value {
        white-space: nowrap;
        font-weight: 700;
        color: #1e293b;
        font-size: 1.1em;
        margin-top: 2px;
      }

      .servo-control-container {
        margin: 25px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .rotation-toggle-button {
        padding: 12px 30px;
        font-size: 1em;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
        color: #475569;
      }

      .rotation-toggle-button.enabled {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
      }

      .rotation-toggle-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      }

      .rotation-toggle-button.enabled:hover {
        box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
      }

      .rotation-toggle-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .servo-slider-container {
        position: relative;
        width: 100%;
        max-width: 400px;
        margin: 20px 0;
        padding: 0 10px;
      }

      .servo-slider-label {
        text-align: center;
        margin-bottom: 15px;
        font-size: 0.9em;
        color: #64748b;
        font-weight: 600;
      }

      .servo-slider {
        width: 100%;
        height: 8px;
        border-radius: 5px;
        background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
        outline: none;
        -webkit-appearance: none;
        appearance: none;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .servo-slider:hover {
        background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%);
      }

      .servo-slider:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Webkit (Chrome, Safari, Edge) */
      .servo-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        cursor: grab;
        border: 3px solid white;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        transition: all 0.2s ease;
      }

      .servo-slider::-webkit-slider-thumb:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
      }

      .servo-slider::-webkit-slider-thumb:active {
        cursor: grabbing;
        transform: scale(1.15);
      }

      .servo-slider:disabled::-webkit-slider-thumb {
        cursor: not-allowed;
        opacity: 0.5;
      }

      /* Firefox */
      .servo-slider::-moz-range-thumb {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        cursor: grab;
        border: 3px solid white;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        transition: all 0.2s ease;
      }

      .servo-slider::-moz-range-thumb:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
      }

      .servo-slider::-moz-range-thumb:active {
        cursor: grabbing;
        transform: scale(1.15);
      }

      .servo-slider:disabled::-moz-range-thumb {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .servo-slider-track {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 10px;
        flex-wrap: nowrap;
      }

      .servo-slider-value {
        min-width: 50px;
        text-align: center;
        font-weight: 700;
        color: #1e293b;
        font-size: 1.1em;
      }

      .distance-threshold-slider {
        width: 100%;
        height: 8px;
        border-radius: 5px;
        background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
        outline: none;
        -webkit-appearance: none;
        appearance: none;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .distance-threshold-slider:hover {
        background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%);
      }

      /* Webkit (Chrome, Safari, Edge) */
      .distance-threshold-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        cursor: grab;
        border: 3px solid white;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        transition: all 0.2s ease;
      }

      .distance-threshold-slider::-webkit-slider-thumb:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 16px rgba(16, 185, 129, 0.6);
      }

      .distance-threshold-slider::-webkit-slider-thumb:active {
        cursor: grabbing;
        transform: scale(1.15);
      }

      /* Firefox */
      .distance-threshold-slider::-moz-range-thumb {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        cursor: grab;
        border: 3px solid white;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        transition: all 0.2s ease;
      }

      .distance-threshold-slider::-moz-range-thumb:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 16px rgba(16, 185, 129, 0.6);
      }

      .distance-threshold-slider::-moz-range-thumb:active {
        cursor: grabbing;
        transform: scale(1.15);
      }

      @media (max-width: 480px) {
        .rotation-toggle-button {
          padding: 10px 25px;
          font-size: 0.9em;
        }

        .servo-slider-container {
          max-width: 100%;
        }
      }

      @media (max-width: 768px) {
        body {
          padding: 10px;
          align-items: flex-start;
          min-height: auto;
        }

        .container {
          padding: 25px 20px;
          max-width: 100%;
          border-radius: 20px;
          margin: 10px 0;
        }

        h1 {
          font-size: 1.8em;
          margin-bottom: 6px;
        }

        .subtitle {
          font-size: 0.85em;
          margin-bottom: 25px;
        }

        .distance-display {
          font-size: 2.2em;
          padding: 25px 15px;
          min-height: 90px;
          margin: 20px 0;
        }

        .radar-container {
          margin: 25px 0;
        }

        .radar-canvas {
          max-width: 100%;
          width: 100%;
        }

        .radar-info {
          gap: 12px;
          margin-top: 15px;
        }

        .info-item {
          min-width: 0;
          flex: 1;
          padding: 12px 10px;
          min-width: 70px;
        }

        .info-label {
          font-size: 0.7em;
        }

        .info-value {
          font-size: 1em;
        }

        .header-controls {
          margin-bottom: 25px;
        }

        .toggle-button {
          padding: 12px 30px;
          font-size: 1em;
          max-width: 100%;
        }

        .status {
          padding: 10px 15px;
          font-size: 0.8em;
          max-width: 100%;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 5px;
        }

        .container {
          padding: 20px 15px;
          border-radius: 16px;
        }

        h1 {
          font-size: 1.5em;
        }

        .subtitle {
          font-size: 0.8em;
          margin-bottom: 20px;
        }

        .distance-display {
          font-size: 1.8em;
          padding: 20px 12px;
          min-height: 80px;
          margin: 15px 0;
        }

        .radar-container {
          margin: 20px 0;
        }

        .radar-info {
          gap: 8px;
          flex-direction: column;
          width: 100%;
        }

        .info-item {
          width: 100%;
          flex-direction: row;
          justify-content: space-between;
          padding: 10px 15px;
        }

        .info-label {
          margin-bottom: 0;
          margin-right: 10px;
        }

        .info-value {
          margin-top: 0;
        }

        .header-controls {
          margin-bottom: 20px;
          gap: 10px;
        }

        .toggle-button {
          padding: 12px 25px;
          font-size: 0.95em;
          max-width: 100%;
        }

        .status {
          font-size: 0.75em;
          padding: 8px 12px;
          max-width: 100%;
        }
      }

      @media (max-width: 360px) {
        .container {
          padding: 15px 12px;
        }

        h1 {
          font-size: 1.3em;
        }

        .distance-display {
          font-size: 1.5em;
          padding: 18px 10px;
          min-height: 70px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>ESP32 Radar</h1>
      <p class="subtitle">Real-time Distance Monitoring</p>

      <div class="header-controls">
        <button class="toggle-button inactive" id="toggleBtn">
          Start System
        </button>
        <div class="status connecting" id="status">Connecting...</div>
      </div>

      <div class="distance-display" id="distance">---</div>

      <div class="radar-container">
        <canvas id="radarCanvas" class="radar-canvas"></canvas>
        <div class="radar-info">
          <div class="info-item">
            <span class="info-label">Current Angle</span>
            <span class="info-value" id="currentAngle">0°</span>
          </div>
          <div class="info-item">
            <span class="info-label">Max Range</span>
            <span class="info-value" id="maxRangeDisplay">400 cm</span>
          </div>
        </div>
      </div>

      <div class="servo-control-container">
        <button class="rotation-toggle-button enabled" id="rotationToggleBtn">
          Auto Rotation: ON
        </button>
        <div class="servo-slider-container" id="servoSliderContainer">
          <div class="servo-slider-label">Manual Servo Control</div>
          <div class="servo-slider-track">
            <span
              style="
                font-size: 0.85em;
                color: #64748b;
                white-space: nowrap;
                flex-shrink: 0;
                display: inline-block;
              "
              >0°</span
            >
            <input
              type="range"
              min="0"
              max="180"
              value="90"
              class="servo-slider"
              id="servoSlider"
            />
            <span
              style="
                font-size: 0.85em;
                color: #64748b;
                white-space: nowrap;
                flex-shrink: 0;
                display: inline-block;
              "
              >180°</span
            >
          </div>
          <div class="servo-slider-value" id="manualAngle">90°</div>
        </div>
      </div>

      <div class="servo-control-container">
        <div class="servo-slider-container" id="distanceThresholdContainer">
          <div class="servo-slider-label">Distance Threshold</div>
          <div class="servo-slider-track">
            <span
              style="
                font-size: 0.85em;
                color: #64748b;
                white-space: nowrap;
                flex-shrink: 0;
                display: inline-block;
              "
              >5</span
            >
            <input
              type="range"
              min="5"
              max="400"
              value="400"
              class="distance-threshold-slider"
              id="distanceThresholdSlider"
            />
            <span
              style="
                font-size: 0.85em;
                color: #64748b;
                white-space: nowrap;
                flex-shrink: 0;
                display: inline-block;
              "
              >400</span
            >
          </div>
          <div class="servo-slider-value" id="distanceThresholdValue">
            400 cm
          </div>
        </div>
      </div>

      <div class="servo-control-container">
        <div class="servo-slider-container" id="servoSpeedContainer">
          <div class="servo-slider-label">Rotation Speed</div>
          <div class="servo-slider-track">
            <span
              style="
                font-size: 0.85em;
                color: #64748b;
                white-space: nowrap;
                flex-shrink: 0;
                display: inline-block;
              "
              >0.5x</span
            >
            <input
              type="range"
              min="0.5"
              max="2.0"
              step="0.1"
              value="1.0"
              class="servo-slider"
              id="servoSpeedSlider"
            />
            <span
              style="
                font-size: 0.85em;
                color: #64748b;
                white-space: nowrap;
                flex-shrink: 0;
                display: inline-block;
              "
              >2.0x</span
            >
          </div>
          <div class="servo-slider-value" id="servoSpeedValue">1.0x</div>
        </div>
      </div>
    </div>

    <script>
      let systemActive = false;
      let rotationEnabled = true;
      const distanceEl = document.getElementById("distance");
      const statusEl = document.getElementById("status");
      const toggleBtn = document.getElementById("toggleBtn");
      const rotationToggleBtn = document.getElementById("rotationToggleBtn");
      const currentAngleEl = document.getElementById("currentAngle");
      const maxRangeDisplayEl = document.getElementById("maxRangeDisplay");
      const manualAngleEl = document.getElementById("manualAngle");
      const servoSlider = document.getElementById("servoSlider");
      const distanceThresholdSlider = document.getElementById(
        "distanceThresholdSlider"
      );
      const distanceThresholdValueEl = document.getElementById(
        "distanceThresholdValue"
      );
      const servoSpeedSlider = document.getElementById("servoSpeedSlider");
      const servoSpeedValueEl = document.getElementById("servoSpeedValue");
      const ws = new WebSocket(`ws://${location.hostname}:81/`);

      // Radar canvas setup
      const canvas = document.getElementById("radarCanvas");
      const ctx = canvas.getContext("2d");

      let maxRange = 400; // cm - default max range, can be changed via slider

      // Store detected targets with timestamps for fading
      let targets = [];
      let currentAngle = 0;
      let sweepAngle = 0;

      // Make canvas responsive
      function resizeCanvas() {
        const container = canvas.parentElement;
        const containerWidth = container.offsetWidth;
        const padding = 40; // Account for container padding
        const maxSize = Math.min(
          450,
          containerWidth - padding,
          window.innerWidth - padding
        );

        // Set canvas size
        canvas.width = maxSize;
        canvas.height = maxSize;

        // Set CSS size to maintain aspect ratio
        canvas.style.width = maxSize + "px";
        canvas.style.height = maxSize + "px";
      }

      // Initial resize
      resizeCanvas();

      // Resize on window resize with debounce
      let resizeTimeout;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          resizeCanvas();
        }, 100);
      });

      // Also resize when orientation changes
      window.addEventListener("orientationchange", () => {
        setTimeout(() => {
          resizeCanvas();
        }, 200);
      });

      function updateButtonState(active, rotationEnabledState, speedMultiplier) {
        systemActive = active;
        if (active) {
          toggleBtn.textContent = "Stop System";
          toggleBtn.className = "toggle-button active";
        } else {
          toggleBtn.textContent = "Start System";
          toggleBtn.className = "toggle-button inactive";
          // Reset distance display when system becomes inactive
          distanceEl.textContent = "---";
          // Clear targets when system stops
          targets = [];
        }

        // Update rotation state if provided
        if (rotationEnabledState !== undefined) {
          rotationEnabled = rotationEnabledState;
        }
        updateRotationToggle();
        
        // Update speed multiplier if provided
        if (speedMultiplier !== undefined) {
          servoSpeedSlider.value = speedMultiplier;
          servoSpeedValueEl.textContent = parseFloat(speedMultiplier).toFixed(1) + "x";
        }
      }

      function updateRotationToggle() {
        if (rotationEnabled) {
          rotationToggleBtn.textContent = "Auto Rotation: ON";
          rotationToggleBtn.className = "rotation-toggle-button enabled";
          servoSlider.disabled = true;
        } else {
          rotationToggleBtn.textContent = "Auto Rotation: OFF";
          rotationToggleBtn.className = "rotation-toggle-button";
          // Enable slider when rotation is disabled (can control servo manually)
          servoSlider.disabled = false;
        }
      }

      function drawRadar() {
        // Update canvas dimensions if resized
        const currentCenterX = canvas.width / 2;
        const currentCenterY = canvas.height / 2;
        const currentMaxRadius = Math.min(currentCenterX, currentCenterY) - 25;

        // Clear canvas with slight fade for sweep trail effect
        ctx.fillStyle = "rgba(10, 14, 39, 0.08)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw concentric circles (distance rings)
        ctx.strokeStyle = "rgba(0, 255, 0, 0.35)";
        ctx.lineWidth = 1.5;
        for (let i = 1; i <= 4; i++) {
          const radius = (currentMaxRadius * i) / 4;
          ctx.beginPath();
          ctx.arc(currentCenterX, currentCenterY, radius, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Draw angle lines (0°, 45°, 90°, 135°, 180°) - rotated 90° counter-clockwise and horizontally mirrored
        ctx.strokeStyle = "rgba(0, 255, 0, 0.25)";
        ctx.lineWidth = 1;
        const angles = [0, 45, 90, 135, 180];
        angles.forEach((angle) => {
          // Horizontally mirror: 180 - angle, then rotate 90° counter-clockwise
          const mirroredAngle = 180 - angle;
          const rad = ((mirroredAngle - 90 - 90) * Math.PI) / 180;
          ctx.beginPath();
          ctx.moveTo(currentCenterX, currentCenterY);
          ctx.lineTo(
            currentCenterX + Math.cos(rad) * currentMaxRadius,
            currentCenterY + Math.sin(rad) * currentMaxRadius
          );
          ctx.stroke();
        });

        // Draw angle labels (responsive font size) - rotated 90° counter-clockwise and horizontally mirrored
        const fontSize = Math.max(10, Math.min(13, currentMaxRadius / 20));
        ctx.font = `bold ${fontSize}px monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        angles.forEach((angle) => {
          // Horizontally mirror: 180 - angle, then rotate 90° counter-clockwise
          const mirroredAngle = 180 - angle;
          const rad = ((mirroredAngle - 90 - 90) * Math.PI) / 180;
          const labelOffset =
            currentMaxRadius + Math.max(12, currentMaxRadius / 20);
          const labelX = currentCenterX + Math.cos(rad) * labelOffset;
          const labelY = currentCenterY + Math.sin(rad) * labelOffset;
          // Add background for better readability
          const labelWidth = fontSize * 2.5;
          const labelHeight = fontSize * 1.5;
          ctx.fillStyle = "rgba(10, 14, 39, 0.7)";
          ctx.fillRect(
            labelX - labelWidth / 2,
            labelY - labelHeight / 2,
            labelWidth,
            labelHeight
          );
          ctx.fillStyle = "rgba(0, 255, 0, 0.9)";
          ctx.fillText(angle + "°", labelX, labelY);
        });

        // Draw distance labels (responsive font size) - dynamic based on maxRange
        const distanceFontSize = Math.max(
          8,
          Math.min(11, currentMaxRadius / 25)
        );
        ctx.font = `bold ${distanceFontSize}px monospace`;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        for (let i = 1; i <= 4; i++) {
          const radius = (currentMaxRadius * i) / 4;
          const distance = Math.round((maxRange * i) / 4);
          const labelX =
            currentCenterX + radius - Math.max(20, currentMaxRadius / 15);
          const labelY = currentCenterY - 8;
          const labelWidth = distanceFontSize * (distance >= 100 ? 4 : 3.5);
          const labelHeight = distanceFontSize * 1.5;
          // Add background for better readability
          ctx.fillStyle = "rgba(10, 14, 39, 0.7)";
          ctx.fillRect(
            labelX - 2,
            labelY - labelHeight / 2,
            labelWidth,
            labelHeight
          );
          ctx.fillStyle = "rgba(0, 255, 0, 0.8)";
          ctx.fillText(distance + "cm", labelX, labelY);
        }

        // Draw sweep line - rotated 90° counter-clockwise and horizontally mirrored
        if (systemActive) {
          // Horizontally mirror: 180 - sweepAngle, then rotate 90° counter-clockwise
          const mirroredSweepAngle = 180 - sweepAngle;
          const sweepRad = ((mirroredSweepAngle - 90 - 90) * Math.PI) / 180;

          // Draw sweep arc (trail) - wider and more visible
          ctx.strokeStyle = "rgba(0, 255, 0, 0.15)";
          ctx.lineWidth = 25;
          ctx.beginPath();
          ctx.arc(
            currentCenterX,
            currentCenterY,
            currentMaxRadius,
            sweepRad - 0.15,
            sweepRad + 0.15
          );
          ctx.stroke();

          // Draw main sweep line with gradient effect
          const gradient = ctx.createLinearGradient(
            currentCenterX,
            currentCenterY,
            currentCenterX + Math.cos(sweepRad) * currentMaxRadius,
            currentCenterY + Math.sin(sweepRad) * currentMaxRadius
          );
          gradient.addColorStop(0, "rgba(0, 255, 0, 1)");
          gradient.addColorStop(0.7, "rgba(0, 255, 0, 0.8)");
          gradient.addColorStop(1, "rgba(0, 255, 0, 0.3)");

          ctx.strokeStyle = gradient;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(currentCenterX, currentCenterY);
          ctx.lineTo(
            currentCenterX + Math.cos(sweepRad) * currentMaxRadius,
            currentCenterY + Math.sin(sweepRad) * currentMaxRadius
          );
          ctx.stroke();
        }

        // Draw detected targets
        const now = Date.now();
        targets = targets.filter((target) => {
          const age = now - target.timestamp;
          const fadeTime = 5000; // 5 seconds fade time
          const opacity = Math.max(0, 1 - age / fadeTime);

          if (opacity <= 0) return false;

          // Horizontally mirror target angle, then rotate 90° counter-clockwise
          // Only show targets within the distance threshold
          if (target.distance > maxRange || target.distance < 5) {
            return false; // Filter out targets outside threshold range
          }

          // Horizontally mirror: 180 - angle, then rotate 90° counter-clockwise
          const mirroredTargetAngle = 180 - target.angle;
          const angleRad = ((mirroredTargetAngle - 90 - 90) * Math.PI) / 180;
          const distanceRatio = Math.min(target.distance / maxRange, 1);
          const radius = distanceRatio * currentMaxRadius;

          const x = currentCenterX + Math.cos(angleRad) * radius;
          const y = currentCenterY + Math.sin(angleRad) * radius;

          // Draw target ring (outer glow)
          const ringGradient = ctx.createRadialGradient(x, y, 0, x, y, 10);
          ringGradient.addColorStop(0, `rgba(255, 0, 0, ${opacity * 0.3})`);
          ringGradient.addColorStop(1, `rgba(255, 0, 0, 0)`);
          ctx.fillStyle = ringGradient;
          ctx.beginPath();
          ctx.arc(x, y, 10, 0, Math.PI * 2);
          ctx.fill();

          // Draw target ring
          ctx.strokeStyle = `rgba(255, 0, 0, ${opacity * 0.6})`;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(x, y, 9, 0, Math.PI * 2);
          ctx.stroke();

          // Draw target blip (bright center)
          const blipGradient = ctx.createRadialGradient(x, y, 0, x, y, 5);
          blipGradient.addColorStop(0, `rgba(255, 100, 100, ${opacity})`);
          blipGradient.addColorStop(1, `rgba(255, 0, 0, ${opacity * 0.7})`);
          ctx.fillStyle = blipGradient;
          ctx.beginPath();
          ctx.arc(x, y, 5, 0, Math.PI * 2);
          ctx.fill();

          // Draw bright center dot
          ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
          ctx.beginPath();
          ctx.arc(x, y, 2, 0, Math.PI * 2);
          ctx.fill();

          return true;
        });

        // Center dot with glow
        const centerGradient = ctx.createRadialGradient(
          currentCenterX,
          currentCenterY,
          0,
          currentCenterX,
          currentCenterY,
          6
        );
        centerGradient.addColorStop(0, "rgba(0, 255, 0, 1)");
        centerGradient.addColorStop(0.5, "rgba(0, 255, 0, 0.6)");
        centerGradient.addColorStop(1, "rgba(0, 255, 0, 0)");
        ctx.fillStyle = centerGradient;
        ctx.beginPath();
        ctx.arc(currentCenterX, currentCenterY, 6, 0, Math.PI * 2);
        ctx.fill();

        // Center dot core
        ctx.fillStyle = "rgba(0, 255, 0, 0.9)";
        ctx.beginPath();
        ctx.arc(currentCenterX, currentCenterY, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Animation loop
      function animate() {
        drawRadar();
        requestAnimationFrame(animate);
      }
      animate();

      toggleBtn.addEventListener("click", () => {
        ws.send(JSON.stringify({ command: "toggle" }));
      });

      rotationToggleBtn.addEventListener("click", () => {
        ws.send(JSON.stringify({ command: "toggleRotation" }));
      });

      // Native slider for manual servo control
      let lastSentAngle = -1; // Track last sent angle to avoid duplicate messages
      let sendTimeout = null; // Throttle WebSocket messages

      function updateSliderPosition(angle, sendToServer = true) {
        servoSlider.value = angle;
        manualAngleEl.textContent = Math.round(angle) + "°";

        // Send to server with throttling (only send if angle changed significantly or after delay)
        if (sendToServer && !rotationEnabled) {
          const angleDiff = Math.abs(angle - lastSentAngle);

          // Clear existing timeout
          if (sendTimeout) {
            clearTimeout(sendTimeout);
          }

          // Send immediately if angle changed by more than 2 degrees
          if (angleDiff > 2) {
            sendServoPosition(angle);
            lastSentAngle = angle;
          } else {
            // Otherwise throttle to send after 50ms of no movement
            sendTimeout = setTimeout(() => {
              if (Math.abs(angle - lastSentAngle) > 0.5) {
                sendServoPosition(angle);
                lastSentAngle = angle;
              }
            }, 50);
          }
        }
      }

      function sendServoPosition(angle) {
        // Send servo position to ESP32
        ws.send(
          JSON.stringify({
            command: "setServoPosition",
            angle: parseFloat(angle),
          })
        );
      }

      // Initialize slider to center position (90°)
      updateSliderPosition(90, false);

      // Handle slider input (while dragging)
      servoSlider.addEventListener("input", (e) => {
        if (!rotationEnabled) {
          const angle = parseFloat(e.target.value);
          updateSliderPosition(angle, true);
        }
      });

      // Handle slider change (when released)
      servoSlider.addEventListener("change", (e) => {
        if (!rotationEnabled) {
          // Clear any pending timeout and send final position
          if (sendTimeout) {
            clearTimeout(sendTimeout);
          }
          const angle = parseFloat(e.target.value);
          sendServoPosition(angle);
          lastSentAngle = angle;
        }
      });

      // Distance threshold slider handler
      function updateDistanceThreshold(value) {
        maxRange = parseFloat(value);
        distanceThresholdValueEl.textContent = Math.round(maxRange) + " cm";
        maxRangeDisplayEl.textContent = Math.round(maxRange) + " cm";

        // Filter existing targets to remove those outside threshold
        const now = Date.now();
        targets = targets.filter((target) => {
          const age = now - target.timestamp;
          const fadeTime = 5000;
          const opacity = Math.max(0, 1 - age / fadeTime);

          // Remove targets outside threshold or faded out
          return (
            opacity > 0 && target.distance <= maxRange && target.distance >= 5
          );
        });
      }

      // Handle distance threshold slider input (while dragging)
      distanceThresholdSlider.addEventListener("input", (e) => {
        updateDistanceThreshold(e.target.value);
      });

      // Handle distance threshold slider change (when released)
      distanceThresholdSlider.addEventListener("change", (e) => {
        updateDistanceThreshold(e.target.value);
      });

      // Initialize distance threshold display
      updateDistanceThreshold(400);

      // Servo speed slider handler
      let speedTouched = false;
      function updateServoSpeed(value) {
        const multiplier = parseFloat(value);
        servoSpeedValueEl.textContent = multiplier.toFixed(1) + "x";
        speedTouched = true;

        // Send to server ONLY if websocket is open (avoids InvalidStateError during CONNECTING)
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(
            JSON.stringify({
              command: "setServoSpeed",
              multiplier: multiplier,
            })
          );
        }
      }

      // Handle servo speed slider input (while dragging)
      servoSpeedSlider.addEventListener("input", (e) => {
        updateServoSpeed(e.target.value);
      });

      // Handle servo speed slider change (when released)
      servoSpeedSlider.addEventListener("change", (e) => {
        updateServoSpeed(e.target.value);
      });

      // Initialize servo speed display
      servoSpeedSlider.value = "1.0";
      servoSpeedValueEl.textContent = "1.0x";

      ws.onopen = () => {
        statusEl.textContent = "Connected";
        statusEl.className = "status connected";
        // If user moved the slider while still connecting, push the latest value now.
        if (speedTouched) {
          updateServoSpeed(servoSpeedSlider.value);
        }
        // State will be sent automatically by server on connection
      };

      ws.onclose = () => {
        statusEl.textContent = "Disconnected";
        statusEl.className = "status disconnected";
      };

      ws.onerror = () => {
        statusEl.textContent = "Connection Error";
        statusEl.className = "status disconnected";
      };

      ws.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.type === "state") {
            updateButtonState(data.active, data.rotationEnabled, data.speedMultiplier);
          } else if (data.type === "distance") {
            distanceEl.textContent = data.value;

            // Update radar with new reading
            if (data.angle !== undefined && data.distance !== undefined) {
              currentAngle = data.angle;
              sweepAngle = data.angle;
              currentAngleEl.textContent = Math.round(data.angle) + "°";

              // Update slider position to reflect current servo position
              // Don't send to server since this is already the server's position
              if (!rotationEnabled || data.angle !== undefined) {
                updateSliderPosition(data.angle, false);
                lastSentAngle = data.angle; // Sync last sent angle
              }

              // Add target if valid reading and within threshold (5cm to maxRange)
              if (
                data.distance > 0 &&
                data.distance >= 5 &&
                data.distance <= maxRange
              ) {
                targets.push({
                  angle: data.angle,
                  distance: data.distance,
                  timestamp: Date.now(),
                });
              }
            }
          }
        } catch (err) {
          // Fallback: treat as plain distance string
          distanceEl.textContent = e.data;
        }
      };
    </script>
  </body>
</html>
